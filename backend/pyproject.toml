[project]
name = "tti-backend"
version = "0.1.0"
description = "Telegram Threat Intelligence (TTI) Backend Foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.1",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.19",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "celery>=5.4.0",
    "flower>=2.0.1",
    "aiogram>=3.15.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
    "regex>=2024.0.0",
    "telethon>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "redis: marks tests that require a running Redis instance",
]
